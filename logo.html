import React from "react";

export default function VelocityVenturesLogo() {

    <div className="container">
      <div className="logo">
        <div className="orbit"></div>
        <div className="rocket">
          <div className="window"></div>
          <div className="flame"></div>
        </div>
      </div>

  );
}
